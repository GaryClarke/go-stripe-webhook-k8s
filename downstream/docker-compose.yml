# Local development: PostgreSQL for the downstream admin service.
# Copy this folder to your new repo root, then: docker compose up -d
#
# Optional next steps (new repo):
# - Add a `Dockerfile` for the Go API and an `api` service that `build: .` and
#   `depends_on: db` with DATABASE_URL pointing at `postgres://downstream:downstream@db:5432/downstream?sslmode=disable`
# - Keep Angular on the host (`ng serve`) or add a separate image for production builds.

services:
  db:
    image: postgres:16-alpine
    container_name: downstream-postgres
    environment:
      POSTGRES_USER: downstream
      POSTGRES_PASSWORD: downstream
      POSTGRES_DB: downstream
    ports:
      # Host 5433 avoids clashing with a local Postgres on 5432
      - "5433:5432"
    volumes:
      - downstream_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U downstream -d downstream"]
      interval: 3s
      timeout: 5s
      retries: 5

  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     DATABASE_URL: postgres://downstream:downstream@db:5432/downstream?sslmode=disable
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  downstream_pgdata:
