# CI runs on every push to main. Jobs: compile check, tests, lint.
# Legacy AWS Terraform/Lambda lives under terraform/ but is not built here.
name: CI

on:
    push:
        branches: [main]

jobs:
    # Quick compile check: does all Go code build? No artifact produced.
    # Catches syntax errors and import problems. Runs in seconds.
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: "1.26"

            - name: Build
              run: go build ./...

    # Run tests.
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: "1.26"

            - name: Test
              run: go test ./...

    # Lint: go vet + golangci-lint (if installed). See Makefile.
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: "1.26"

            - name: Lint
              run: make lint
